<!DOCTYPE HTML>
<html>

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Taman Tasik Putra</title>
        <link rel="stylesheet" href="style.css"/>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"/>
    </head>

    <body>
        <nav id="navbar-fixed" class="scrolled">
            <!-- Navbar template will load here -->
        </nav>

        <div class="overlay" id="gal-overlay">
            <button class="info-button wide gal-prev"><img src="resources/prev.svg"></button>
            <div class="overlay-box">

                <div class="zoomed-image"><img id="image-zoomed" src="media/act01.jpg"></div>
                <div class="zoomed-textbox">
                    <button class="close-button" id="overlay-close"><img src="resources/close.svg"></button>

                    <h6 class="description-tag">TITLE</h6>
                    <h2 id="image-title"></h2>
                    <h6 class="description-tag">DESCRIPTION</h6>
                    <p id="image-desc"></p>
                </div>

            </div>
            <div class="button-container">
                <button class="info-button gal-prev"><img src="resources/prev.svg"></button>
                <button class="info-button gal-next"><img src="resources/next.svg"></button>
            </div>

            <button class="info-button wide gal-next"><img src="resources/next.svg"></button>
        </div>
            
        <div class="subpage-container">
            <div class="subpage-content">

                <div class="subpage-side-head">
                    <div class="side-title">
                        <a href="index.html"><img src="resources/clipart.gif" alt="Icon"></a>
                        <h1>Gallery</h1>
                    </div>
                </div>
                <div class="subpage-side-text">
                    <div class="text-container wider">
                        <p>View a collection of photos taken in Taman Tasik Putra. <br>Click an image to see more info.</p>
                    </div>
                    <div class="gallery-container">

                        <img class="gallery-image" src="media/sce01.jpg" alt="Outside View" 
                            data-description="A giant signboard that holds the park's name and fame.">
                        <img class="gallery-image" src="media/act01.jpg" alt="A walk in the park" 
                            data-description="Many people like to come here for a walk in the morning. It's better than staying at home.">
                        <img class="gallery-image" src="media/act02.jpg" alt="A walk in the park 2" 
                            data-description="This park gets very crowded on Saturday mornings.">
                        <img class="gallery-image" src="media/act05.jpg" alt="Senamrobik 1" 
                            data-description="Sometimes you can see a group of aunties/uncles doing aerobics in the morning. They will wear a uniform sometimes.">
                        <img class="gallery-image" src="media/act06.jpg" alt="Senamrobik 2" 
                            data-description="There are also aerobic activites where everyone can join in!">
                        <img class="gallery-image" src="media/act11.jpg" alt="Fishing" 
                            data-description="Everyday, you will see people fishing at the lakeside. It's a relaxing activity to ease the mind.">
                        <img class="gallery-image" src="media/act12.jpg" alt="Picnic by the Lakeside" 
                            data-description="Families come here for picnics too. Enjoying the greenery surrounding them and the view of the lake is truly an unforgettable experience.">
                        <img class="gallery-image" src="media/sce04.jpg" alt="A Wider View" 
                            data-description="The spacious atmosphere of the track, filled with leisure, surrounded by nature.">
                        <img class="gallery-image" src="media/sce08.jpg" alt="From the corner" 
                            data-description="You can see Hotel Seri Malaysia from a distance.">
                        <img class="gallery-image" src="media/act13.jpg" alt="Bird Flight" 
                            data-description="In the evenings, when the park is less crowded, there are people who bring birds for flight training.">
                        <img class="gallery-image" src="media/sce06.jpg" alt="Tasik" 
                            data-description="Some people are fishing from the other side.">
                        <img class="gallery-image" src="media/sce10.jpg" alt="Opposite the lake" 
                            data-description="The area is covered by thick layers of tree leaves, with the lake visible under the sunlight.">
                        
                    </div>
                </div>

            </div>
        </div>

        <footer id="footer">
            <!-- Footer template will load here -->
        </footer>
        
        <script src="script.js"></script>
    </body>

</html>
